<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الإسعافات الأولية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f4;--sf:#fff;--tx:#14262b;--mt:#5a6d71;--ac:#c8102e;--ac2:#0f5c5c;--ok:#16794a;--okb:#e4f5ec;--nob:#fde8ea;--bd:#d3dedc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1819;--sf:#16282a;--tx:#e8f1f0;--mt:#9bb0b2;--ac:#ff5a70;--ac2:#4fc3c3;--ok:#55d195;--okb:#12382a;--nob:#3d1a20;--bd:#2c4346}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1819;--sf:#16282a;--tx:#e8f1f0;--mt:#9bb0b2;--ac:#ff5a70;--ac2:#4fc3c3;--ok:#55d195;--okb:#12382a;--nob:#3d1a20;--bd:#2c4346}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.7 Tajawal,Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.3;margin:12px 0 6px;font-weight:800}
h2{font-size:19px;line-height:1.6;margin:6px 0 14px;font-weight:800}
p{margin:0 0 10px;color:var(--mt)}
.mark{width:54px;height:54px;border-radius:14px;background:var(--ac);position:relative}
.mark:before,.mark:after{content:"";position:absolute;background:#fff;border-radius:2px;inset:0;margin:auto}
.mark:before{width:30px;height:9px}.mark:after{width:9px;height:30px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;margin-bottom:12px;font-weight:800}
input{width:100%;font:inherit;padding:11px 12px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input[type=tel]{direction:ltr;text-align:right}
small.e{display:block;color:var(--ac);font-weight:500;min-height:0}
.btn{display:block;width:100%;font:inherit;font-weight:800;padding:13px;border:0;border-radius:12px;background:var(--ac2);color:#fff;cursor:pointer;margin-top:10px}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0d1819}
@media (prefers-color-scheme:light){.btn{color:#fff}}
.btn.alt{background:transparent;color:var(--ac2);border:1px solid var(--ac2)}
.lnk{font:inherit;background:none;border:0;color:var(--ac);cursor:pointer;padding:4px 0;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top span{color:var(--mt);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{font:inherit;font-size:14px;padding:5px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer}
.chip.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.op{display:block;width:100%;text-align:right;font:inherit;padding:12px 14px;margin:8px 0;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);cursor:pointer}
.op.ok{border-color:var(--ok);background:var(--okb)}
.op.no{border-color:var(--ac);background:var(--nob)}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px}
.fb p{color:var(--tx);margin:4px 0 0}
.fb.g{background:var(--okb);color:var(--ok)}.fb.r{background:var(--nob);color:var(--ac)}
.score{font-size:54px;font-weight:800;line-height:1.1;color:var(--ac)}
details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:800}
details b{color:var(--ok)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// [القسم, السؤال, الجواب الصحيح, [إجابات خاطئة], الشرح]
const Q=[
["الإنعاش","ما معدل ضغطات الصدر الصحيح عند إنعاش شخص بالغ؟","100 إلى 120 ضغطة في الدقيقة",["60 إلى 80 ضغطة في الدقيقة","80 إلى 100 ضغطة في الدقيقة","140 إلى 160 ضغطة في الدقيقة"],"الأبطأ لا يضخ دماً كافياً، والأسرع يمنع ارتداد الصدر فيقل امتلاء القلب."],
["الإنعاش","ما عمق الضغطات الصحيح عند البالغ؟","5 إلى 6 سم",["2 إلى 3 سم","3 إلى 4 سم","7 إلى 8 سم"],"أقل من 5 سم غير فعال، وأكثر من 6 سم يرفع خطر كسر الأضلاع. اترك الصدر يرتد كاملاً بين الضغطات."],
["الإنعاش","ما نسبة الضغطات إلى النفخات عند إنعاش بالغ؟","30 ضغطة ثم نفختان",["15 ضغطة ثم نفختان","30 ضغطة ثم نفخة واحدة","5 ضغطات ثم نفخة واحدة"],"نسبة 15:2 تخص الأطفال والرضع عند وجود منقذين محترفين."],
["الإنعاش","ما أقصى مدة مقبولة لتوقف الضغطات (لتقييم أو نفخات)؟","أقل من 10 ثوانٍ",["30 ثانية","دقيقة كاملة","20 ثانية"],"ضغط التروية يهبط بسرعة عند التوقف ويحتاج وقتاً ليعود، فتقلَّل الانقطاعات."],
["الإنعاش","بعد صدمة جهاز AED، ما التصرف الصحيح؟","استئناف الضغطات فوراً لدقيقتين",["فحص النبض دقيقة كاملة","الانتظار دون أي ضغط","نقل المصاب فوراً"],"الجهاز يعيد التحليل بعد دقيقتين من الضغطات المستمرة."],
["الإنعاش","كيف تُجرى ضغطات الرضيع بمنقذ واحد؟","بإصبعين على النصف السفلي من القص بعمق ثلث الصدر",["براحة يد واحدة بعمق 5 سم","بكلتا اليدين على كامل الصدر","بإبهام على أعلى القص بعمق 1 سم"],"عمق ثلث قطر الصدر يقارب 4 سم عند الرضيع."],
["الاختناق","بالغ واعٍ بانسداد كامل ولا يستطيع الكلام. وفق توصيات ERC، ما أول إجراء؟","5 ضربات بين لوحي الكتف",["إعطاؤه ماء","إدخال الأصبع لإخراج الجسم","استلقاؤه على الأرض"],"بعدها 5 ضغطات بطن بالتناوب. إدخال الأصبع أعمى قد يدفع الجسم أعمق."],
["الاختناق","رضيع مختنق. ما الإجراء الصحيح؟","5 ضربات على الظهر ثم 5 ضغطات على الصدر",["5 ضغطات بطن (هايمليك)","هزّه رأساً على عقب","إعطاؤه ماء"],"ضغطات البطن ممنوعة قبل سنة لخطر إصابة الكبد."],
["الاختناق","أين تُجرى الضغطات لحامل في شهرها الأخير مختنقة؟","على منتصف الصدر",["على البطن فوق الرحم","على الظهر فقط","على الرقبة"],"البطن غير مناسب لتضخم الرحم، فيُستعاض عنه بالصدر."],
["النزيف","أول إجراء لنزيف شديد من الساعد؟","ضغط مباشر قوي بقماش نظيف",["رفع الطرف دون ضغط","وضع الثلج وحده","غسل الجرح لساعة"],"الضغط المباشر والمستمر يوقف أغلب النزيف الخارجي."],
["النزيف","متى تُستخدم العاصبة؟","عند نزيف طرف مهدِّد للحياة لا يتوقف بالضغط",["لكل جرح نازف","لنزف الأنف","للكدمات"],"توضع 5 إلى 7 سم فوق الجرح لا على مفصل، ويُسجَّل وقتها ولا تُرخى."],
["النزيف","سكين مغروز في الجرح. ما التصرف؟","تثبيته بضمادات حوله دون نزعه",["نزعه بسرعة ثم الضغط","تحريكه لفحص العمق","نزعه وغسل الجرح"],"الجسم المغروز قد يسد وعاءً دموياً، ونزعه يطلق النزف."],
["النزيف","ما الوضعية الصحيحة لنزيف الأنف العفوي؟","جلوس مع ميل للأمام وضغط الجزء اللين 10 دقائق",["استلقاء على الظهر","إمالة الرأس للخلف","حشو الأنف بالقطن عميقاً"],"إمالة الرأس للخلف تجعل الدم يُبتلع وقد تسبب القيء."],
["الحروق","الإسعاف الأولي لحرق بالماء الساخن؟","تبريده بماء جارٍ فاتر 20 دقيقة",["وضع الثلج مباشرة","دهنه بالزبدة","فقع الفقاعات"],"الثلج يضر النسيج، والزبدة تحبس الحرارة وتزيد العدوى."],
["الحروق","حرق كيميائي بمسحوق جاف. الخطوة الأولى؟","نفض المسحوق ثم غسل غزير بالماء",["غسل بماء قليل فوراً","وضع مادة معادِلة","تغطيته دون غسل"],"بعض المساحيق يتفاعل مع القليل من الماء، لذا يُنفض الزائد أولاً."],
["الحروق","أمام حرق كهربائي ما أول خطوة قبل لمس المصاب؟","فصل التيار وتأمين المكان",["سحبه بيد عارية","صب الماء عليه","بدء الإنعاش فوراً"],"لمس المصاب قبل فصل التيار قد يصعقك أنت أيضاً."],
["الإصابات","اشتباه إصابة عمود فقري بعد سقوط. ما التصرف؟","تثبيت الرأس والرقبة وعدم تحريكه إلا للضرورة القصوى",["رفعه لتهدئته","ثني رقبته للأمام","جعله يمشي ببطء"],"أي حركة قد تحوّل كسراً مستقراً إلى إصابة نخاعية."],
["الإصابات","كسر مفتوح وعظم ظاهر. ما التصرف؟","تغطية بضماد معقم وتثبيت الطرف دون إعادة العظم",["إدخال العظم في مكانه","غسل العظم بالكحول","تدليك الطرف"],"إعادة العظم تُدخل الجراثيم وقد تصيب الأوعية والأعصاب."],
["الإصابات","ضربة على الرأس ثم قيء متكرر وصداع شديد ونعاس. ما التصرف؟","طلب إسعاف عاجل",["تركه ينام ومراجعة الغد","مسكن فقط","تدليك الرأس"],"هذه علامات إنذار لنزف أو ضغط داخل الجمجمة."],
["حالات طارئة","علامات السكتة الدماغية بحسب FAST؟","ترهل الوجه وضعف الذراع واضطراب الكلام",["حكة وطفح وتورم","ألم بطن وإسهال","رجفة وبرودة أطراف"],"الحرف T يعني الوقت: كل دقيقة تُتلف ملايين الخلايا العصبية."],
["حالات طارئة","ألم صدر ضاغط يمتد للذراع مع عرق بارد. ماذا تفعل بعد طلب الإسعاف؟","إراحة المصاب ومضغ أسبرين 160 إلى 300 ملغ إن لم تكن لديه حساسية",["جعله يمشي","إعطاؤه ماء بارداً كثيراً","إعطاؤه مضاداً حيوياً"],"الأسبرين يقلل تخثر الصفيحات ويحد من اتساع الجلطة."],
["حالات طارئة","نوبة صرع تشنجية. ما التصرف الصحيح؟","إبعاد الأخطار وحماية الرأس وتوقيت النوبة",["وضع ملعقة بين الأسنان","تثبيت أطرافه بقوة","سكب ماء على وجهه"],"لا يوضع شيء في الفم. تُطلب الإسعاف إن تجاوزت 5 دقائق، ثم وضع الإفاقة."],
["حالات طارئة","سكري واعٍ يرتجف ويتعرق (هبوط سكر). ماذا تعطيه؟","15 إلى 20 غراماً من سكر سريع الامتصاص",["حقنة أنسولين","وجبة دسمة فقط","ماء فقط"],"الأنسولين يخفض السكر أكثر. وبعد 15 دقيقة يُعاد القياس."],
["حالات طارئة","تحسس شديد مع تورم الوجه وصعوبة التنفس. أهم علاج؟","أدرينالين عضلياً في الفخذ الخارجي",["مضاد هيستامين فقط","كمادات باردة","مشروب ساخن"],"مضادات الهيستامين أبطأ ولا تعالج انهيار الدورة والتنفس."],
["حالات طارئة","فاقد الوعي لكنه يتنفس طبيعياً. ما الوضعية؟","وضع الإفاقة على الجانب",["على الظهر مع وسادة","جالساً","على البطن"],"يحمي المجرى الهوائي من اللسان والقيء."],
["بيئة وتسمم","ضربة شمس بحرارة فوق 40 م وهذيان. الأولوية؟","تبريد سريع بماء بارد مع طلب الإسعاف",["مشروب ساخن","تغطيته ببطانية","انتظاره حتى ينام"],"كل دقيقة بحرارة مرتفعة ترفع خطر تلف الدماغ والأعضاء."],
["بيئة وتسمم","انخفاض حرارة الجسم. ما التصرف؟","نزع المبلل وتدفئة الجذع بلطف",["تدليك الأطراف بقوة","شرب كحول للتدفئة","حمام ماء ساخن جداً"],"التدليك القوي والحركة العنيفة قد يسببان اضطراب نظم القلب."],
["بيئة وتسمم","لدغة أفعى. ما الصحيح؟","تثبيت الطرف وتهدئة المصاب ونقله للمستشفى",["شق اللدغة ومص السم","عاصبة شديدة فوق اللدغة","وضع الثلج"],"الشق والمص والعاصبة الشديدة تزيد الضرر ولا تفيد."],
["بيئة وتسمم","اشتباه تسمم بأول أكسيد الكربون. أول خطوة؟","إخراج الجميع للهواء النقي ثم طلب الإسعاف",["فتح نافذة والبقاء","إعطاؤه حليباً","تقليل المدفأة فقط"],"الغاز عديم الرائحة، وأعراضه صداع ودوار قد تُهمَل."],
["بيئة وتسمم","طفل ابتلع منظِّفاً كاوياً. ما التصرف؟","الاتصال بمركز السموم أو الإسعاف دون إثارة القيء",["إثارة القيء فوراً","إعطاؤه حليباً بكمية كبيرة","إعطاؤه ماءً مالحاً"],"القيء يعيد المادة الكاوية على المريء فيحرقه مرة ثانية."],
["بيئة وتسمم","غرق ومصاب لا يتنفس. وفق ERC بماذا يبدأ المنقذ المدرَّب؟","5 نفخات إنقاذ ثم الضغطات",["30 ضغطة مباشرة","ضغطات بطن لإخراج الماء","قلبه رأساً على عقب"],"سبب الغرق نقص الأكسجين، فتُعطى النفخات أولاً."],
["بيئة وتسمم","عند الوصول إلى مكان حادث، ما أول أولوية؟","التأكد من سلامتك وسلامة المكان ثم تقييم المصاب",["الاقتراب من أقرب مصاب فوراً","تحريك كل المصابين","تصوير الحادث"],"إن أصبحت أنت مصاباً فلن تنفع أحداً."],
["الإنعاش","وجدت شخصاً منهاراً لا يستجيب. ما الترتيب الصحيح؟","أمان المكان ثم هزّه بلطف ونداؤه ثم فحص التنفس",["بدء الضغطات فوراً","رش الماء على وجهه","رفع رأسه بوسادة"],"تُفحص الاستجابة والتنفس قبل أي إنعاش، ولا تتجاوز 10 ثوانٍ."],
["الإنعاش","كيف تفتح المجرى الهوائية لفاقد وعي دون اشتباه إصابة رقبة؟","إمالة الرأس للخلف ورفع الذقن",["ثني الرأس للأمام","رفع الكتفين فقط","وضع وسادة تحت الرأس"],"اللسان يسقط للخلف عند فقدان الوعي، وهذه الحركة ترفعه عن المجرى."],
["الإنعاش","أين توضع لصاقتا جهاز AED عند البالغ؟","واحدة أسفل الترقوة اليمنى والأخرى على الجانب الأيسر تحت الإبط",["كلتاهما على البطن","واحدة على الجبهة والأخرى على الصدر","كلتاهما على الكتفين"],"الوضعية تجعل التيار يمر عبر القلب. يُجفَّف الصدر ويُحلق الشعر الكثيف إن لزم."],
["الإنعاش","قبل أن يطلق AED الصدمة، ما الذي يجب التأكد منه؟","ابتعاد الجميع عن المصاب وعدم لمسه",["لمس المصاب لتثبيته","استمرار الضغطات أثناء الصدمة","وضعه على أرض مبللة"],"لمس المصاب أثناء الصدمة قد ينقل التيار إلى المنقذ."],
["الإنعاش","متى يجوز إيقاف الإنعاش؟","عند عودة تنفس طبيعي أو تسلُّم فريق طبي أو إرهاق المنقذ",["بعد دقيقتين دائماً","عند أول شهقة فقط","بعد 10 ضغطات"],"الشهقة المنفردة لا تعني عودة التنفس الطبيعي."],
["الاختناق","مصاب يسعل بقوة ويستطيع الكلام. ما التصرف؟","تشجيعه على السعال ومراقبته دون ضرب ظهره",["ضغطات بطن فوراً","إعطاؤه ماء","رفع يديه للأعلى"],"السعال القوي أنجع وسيلة. تتدخل فقط إذا ضعف أو صار الانسداد كاملاً."],
["النزيف","كيف تميّز النزف الشرياني؟","دم أحمر فاتح يتدفق بنبضات",["دم داكن يسيل ببطء","رشح شفاف بلا لون","نزف تحت الجلد فقط"],"يعد مهدِّداً للحياة لأنه يفقد كمية كبيرة بسرعة، ويحتاج ضغطاً مباشراً قوياً."],
["النزيف","مصاب بنزف وبدت عليه علامات الصدمة. ما الوضعية المناسبة؟","استلقاء مع رفع الساقين إن لم تمنع الإصابة ذلك",["جلوس منتصب","وقوف مع الحركة","شرب ماء بكثرة"],"رفع الساقين يعيد جزءاً من الدم نحو القلب والدماغ، ويُمنع الأكل والشرب تحسباً للجراحة."],
["الحروق","حرق بفقاعات بعد التبريد. ما التصرف؟","تغطيته بضماد معقم غير لاصق دون فقع الفقاعات",["فقع الفقاعات وتنظيفها","دهنه بمعجون الأسنان","تغطيته بقطن لاصق"],"الفقاعة غطاء طبيعي يحمي الجلد من العدوى."],
["الحروق","شخص تشتعل ملابسه. ما التصرف الصحيح؟","أن يتوقف ويستلقي ويتدحرج أو تغطي النار ببطانية",["أن يركض إلى أقرب ماء","نفخ النار","نزع الملابس الملتصقة بالجلد"],"الركض يغذي النار بالأكسجين. الملابس الملتصقة لا تُنزع بل تُبرَّد."],
["الإصابات","ما قاعدة تثبيت الكسر؟","تثبيت المفصلين فوق الكسر وتحته",["تحريك الطرف لتفقد الكسر","تثبيت مفصل واحد فقط","الشد بقوة لإعادة العظم"],"هذا يمنع حركة العظم المكسور ويخفف الألم والنزف."],
["الإصابات","بتر إصبع. كيف يُحفظ الجزء المبتور؟","يُلف بشاش رطب نظيف ويوضع في كيس مغلق فوق ماء وثلج",["يوضع في الثلج مباشرة","يُغمر في الكحول","يُترك مكشوفاً"],"الثلج المباشر يجمّد النسيج ويتلفه، ويجب نقل الجزء مع المصاب بسرعة."],
["الإصابات","مادة كيميائية دخلت العين. ما التصرف؟","غسلها بماء جارٍ غزير 15 دقيقة على الأقل",["فرك العين","وضع أي قطرة متوفرة","تغطيتها فقط"],"الغسل الفوري والطويل أهم من أي علاج آخر، ثم يُراجَع الطبيب."],
["حالات طارئة","ما الأعراض التي تظهر كثيراً عند النساء في النوبة القلبية؟","ضيق نفس وغثيان وألم في الفك أو الظهر",["ألم صدر حاد فقط","حكة جلدية","صداع نصفي فقط"],"قد تغيب أعراض الصدر النموذجية، فلا تُهمل هذه العلامات."],
["حالات طارئة","مصاب بالربو يتنفس بصعوبة. ما الإجراء الأول؟","مساعدته على استعمال بخاخ الإنقاذ مع جلسة مريحة",["استلقاؤه على الظهر","كمادة ساخنة على الصدر","شرب ماء بكثرة"],"إن لم يتحسن بعد دقائق أو ازرق شفتاه فاطلب الإسعاف."],
["حالات طارئة","إغماء بسيط يعود فيه الوعي بسرعة. ما التصرف؟","استلقاؤه ورفع الساقين وفك الملابس الضيقة",["تجليسه فوراً","صفعه على وجهه","إعطاؤه طعاماً وهو فاقد للوعي"],"رفع الساقين يحسّن تدفق الدم للدماغ. وإن لم يفق خلال دقيقة فهي حالة طارئة."],
["بيئة وتسمم","جرعة زائدة من دواء. ما التصرف؟","الاتصال بالإسعاف أو مركز السموم مع تحديد الدواء والكمية",["إثارة القيء","إعطاؤه قهوة قوية","تركه ينام"],"احتفظ بعلبة الدواء، فهي تساعد الفريق الطبي على اختيار العلاج."],
["بيئة وتسمم","لدغة عقرب. ما الصحيح؟","تهدئة المصاب وتثبيت الطرف ونقله للمستشفى بسرعة",["شق مكان اللدغة ومص السم","كي مكان اللدغة","وضع عاصبة شديدة"],"الأطفال أكثر عرضة لتسمم شديد، فلا تنتظر ظهور الأعراض."]
];
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nd=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cats=[...new Set(Q.map(q=>q[0]))];
let user=store.get("fa_user"),cat="all",n=10,S;
const chips=(cur,fn)=>`<div class="chips">${["all",...cats].map(c=>`<button class="chip ${c==cur?"on":""}" data-c="${c}">${c=="all"?"كل الأقسام":c}</button>`).join("")}</div>`;
function bindChips(fn){document.querySelectorAll(".chip[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;fn()})}

// كل تسجيل يصل إلى هذا البريد عبر خدمة FormSubmit
const FORM_ENDPOINT="https://formsubmit.co/ajax/montadr1988@gmail.com";
function send(u){if(FORM_ENDPOINT.includes("PUT_YOUR_ID"))return Promise.resolve();return fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({"الاسم":u.fn,"اللقب":u.ln,"الهاتف":u.ph,"السن":u.ag,_subject:"تسجيل جديد في منصة الإسعافات الأولية"})}).then(r=>{if(!r.ok)throw 0})}
function auth(){
app.innerHTML=`<div class="mark"></div><h1>منصة الإسعافات الأولية</h1><p>سجّل بياناتك ثم ابدأ الأسئلة والأجوبة.</p>
<div class="card">
<label>الاسم<input id="fn" autocomplete="given-name"><small class="e" id="e1"></small></label>
<label>اللقب<input id="ln" autocomplete="family-name"><small class="e" id="e2"></small></label>
<label>رقم الهاتف<input id="ph" type="tel" inputmode="numeric" placeholder="0555123456" autocomplete="tel"><small class="e" id="e3"></small></label>
<label>السن<input id="ag" inputmode="numeric" placeholder="مثال: 25"><small class="e" id="e4"></small></label>
<button class="btn" id="go">تسجيل ومتابعة</button></div>`;
$("#go").onclick=()=>{
const fn=$("#fn").value.trim(),ln=$("#ln").value.trim(),ph=nd($("#ph").value).replace(/[\s-]/g,""),ag=+nd($("#ag").value);
const e=[fn.length<2,ln.length<2,!/^0[567]\d{8}$/.test(ph),!(Number.isInteger(ag)&&ag>=5&&ag<=99)];
const m=["اكتب الاسم (حرفان على الأقل).","اكتب اللقب (حرفان على الأقل).","رقم الهاتف يبدأ بـ 05 أو 06 أو 07 ويتكون من 10 أرقام.","اكتب السن بين 5 و99."];
["e1","e2","e3","e4"].forEach((id,i)=>$("#"+id).textContent=e[i]?m[i]:"");
if(e.some(Boolean))return;
user={fn,ln,ph,ag,at:Date.now()};
const bt=$("#go");bt.disabled=true;bt.textContent="جارٍ التسجيل...";
send(user).then(()=>{store.set("fa_user",user);home()}).catch(()=>{bt.disabled=false;bt.textContent="تسجيل ومتابعة";$("#e4").textContent="تعذر الإرسال. تأكد من الاتصال بالإنترنت وأعد المحاولة."})}}

function home(){
const best=store.get("fa_best");
app.innerHTML=`<div class="top"><div><b>مرحباً ${esc(user.fn)} ${esc(user.ln)}</b><br><span>السن: ${user.ag} سنة. الهاتف: <bdi>${esc(user.ph)}</bdi></span></div><button class="lnk" id="out">تسجيل الخروج</button></div>
<div class="card"><h2>اختبار الإسعافات الأولية</h2><p>${Q.length} سؤالاً بمستوى صعب في ${cats.length} أقسام. كل إجابة يظهر معها التصحيح والشرح.${best!=null?` أفضل نتيجة لك: ${best}%.`:""}</p>
<b>القسم</b>${chips(cat)}<b>عدد الأسئلة</b>
<div class="chips">${[10,20,0].map(v=>`<button class="chip ${v==n?"on":""}" data-n="${v}">${v||"الكل"}</button>`).join("")}</div>
<button class="btn" id="st">ابدأ الاختبار</button></div>
<button class="btn alt" id="br">تصفح كل الأسئلة والأجوبة</button>`;
bindChips(home);
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{n=+b.dataset.n;home()});
$("#st").onclick=start;$("#br").onclick=browse;
$("#out").onclick=()=>{try{localStorage.removeItem("fa_user")}catch(e){}user=null;auth()}}

function start(){
let p=shuf(Q.filter(q=>cat=="all"||q[0]==cat));if(n&&n<p.length)p=p.slice(0,n);
S={l:p.map(q=>({q,o:shuf([q[2],...q[3]])})),i:0,s:0,w:[]};ask()}

function ask(){
const x=S.l[S.i],t=S.l.length;
app.innerHTML=`<div class="top"><button class="lnk" id="hm">إنهاء</button><span>${x.q[0]}، السؤال ${S.i+1} من ${t}</span></div><div class="bar"><i style="width:${S.i/t*100}%"></i></div>
<div class="card"><h2>${esc(x.q[1])}</h2><div>${x.o.map((o,k)=>`<button class="op" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
$("#hm").onclick=home;
document.querySelectorAll(".op").forEach(b=>b.onclick=()=>{
const ok=x.o[b.dataset.k]==x.q[2];
document.querySelectorAll(".op").forEach(c=>{c.disabled=true;if(x.o[c.dataset.k]==x.q[2])c.classList.add("ok")});
if(ok)S.s++;else{b.classList.add("no");S.w.push(x.q)}
$("#fb").innerHTML=`<div class="fb ${ok?"g":"r"}"><b>${ok?"إجابة صحيحة":"إجابة خاطئة، الصحيح: "+esc(x.q[2])}</b><p>${esc(x.q[4])}</p></div><button class="btn" id="nx">${S.i+1<t?"السؤال التالي":"عرض النتيجة"}</button>`;
$("#nx").onclick=()=>{S.i++;S.i<t?ask():done()};$("#nx").focus()})}

function done(){
const t=S.l.length,pc=Math.round(S.s/t*100),b=store.get("fa_best");
if(b==null||pc>b)store.set("fa_best",pc);
const msg=pc>=90?"ممتاز، مستواك عالٍ جداً.":pc>=70?"جيد، راجع أخطاءك أدناه.":"تحتاج مراجعة. اقرأ التصحيحات ثم أعد المحاولة.";
app.innerHTML=`<div class="card" style="text-align:center"><p>${esc(user.fn)} ${esc(user.ln)}</p><div class="score">${pc}%</div><h2>${S.s} من ${t} إجابة صحيحة</h2><p>${msg}</p></div>
${S.w.length?`<h2>تصحيح أخطائك</h2>`+S.w.map(q=>`<details open><summary>${esc(q[1])}</summary><p><b>${esc(q[2])}</b></p><p>${esc(q[4])}</p></details>`).join(""):"<p>لا أخطاء. أحسنت.</p>"}
<button class="btn" id="rt">اختبار جديد</button><button class="btn alt" id="hm">الرئيسية</button>`;
$("#rt").onclick=start;$("#hm").onclick=home}

function browse(){
const l=Q.filter(q=>cat=="all"||q[0]==cat);
app.innerHTML=`<div class="top"><button class="lnk" id="hm">الرئيسية</button><span>${l.length} سؤالاً</span></div><h2>كل الأسئلة والأجوبة</h2>${chips(cat)}
${l.map(q=>`<details><summary>${esc(q[1])}</summary><p><b>${esc(q[2])}</b></p><p>${esc(q[4])}</p></details>`).join("")}`;
bindChips(browse);$("#hm").onclick=home}

user?home():auth();
</script>
</body>
</html>
